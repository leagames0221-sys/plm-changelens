repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: private-path-check
        name: private-path-check
        entry: bash scripts/private_path_check.sh
        language: system
        pass_filenames: false
